# Property Inspector templates for Part Design.
#
# A template lays out the properties it names, in cards of its own, on the
# Data tab of the objects it matches. Every property it does not name is
# laid out as before, under "Everything else", so nothing goes missing -
# not an addon's extension, nor a property a newer FreeCAD adds.
#
# Keys of a template:
#   id        a name, for error messages.
#   types     TypeId patterns (* wildcards); a template applies when every
#             selected object matches one.
#   choices   { enumeration value = "label shown" }, for enumerations.
#   couple    [[template.couple]] { value, mode, zero, nonzero }: a mode
#             (zero) that is another (nonzero) at a value of zero. Shown
#             and written as nonzero; typing the value writes it too.
#   hide_if   { Property = "OtherProperty" }: never show Property while
#             the object has OtherProperty (it supersedes it).
#   hide      [Property, ...]: never shown, as properties these objects
#             have but do not use.
#   group_as  { Property = "Group" }: a property the template leaves out,
#             shown under another of FreeCAD's groups than its own.
#   card      [[template.card]] tables, in order:
#     title   the card's heading.
#     hint    an optional line under the card.
#     column  [[template.card.column]] tables: { title, items, show_if },
#             laid side by side under the card's items; a heading shows
#             only when there are two. show_if as for an item.
#     after   items laid out under the columns.
#     heading = false  no heading: always open, the card's items say
#             what it is.
#     closed_when  { Prop = value or [values] }: the card starts closed,
#             its values summed up in its heading, while every test holds.
#     variables = true  the card holds every property the object added
#             (a VarSet's variables) instead of items; see varset.toml.
#     items   a property name, an inline table, or an array of them laid
#             on one line (the first labelled, the rest after its editor):
#               { prop = "...", label = "...", wide = true/false,
#                 editor = "...", labels = ["no", "yes"],
#                 show_if = { Prop = value or [values] },
#                 omit_if = { value = "Property" },
#                 lead = "Property", trail = "Property", glyph = "...",
#                 narrow = true/false, bare = true/false,
#                 whole = true/false }
#             editor: "dropdown" (an enumeration's default), "segmented"
#             (every choice in view, joined: for a few choices that change
#             the shape; on a yes/no, `labels` names its two states) or
#             "switch" (a yes/no, labelled in place).
#             show_if shows the item only while one of the named
#             properties holds one of its values; a property the object
#             does not have is left out of the test.
#             omit_if leaves an enumeration value out of the choices when
#             the object has the named property (Type's TwoLengths,
#             superseded by SideType in FreeCAD 27).
#             lead shows an enumeration inside the field, before the value
#             (what the value means); trail a yes/no as a glyph button
#             after the editor. narrow takes half the editor column; bare
#             drops the label. whole: on a link, a sketch picked by one of
#             its edges or points stands for the whole sketch.
#
# Names a FreeCAD version does not have are skipped, so one template covers
# versions with Midplane/TwoLengths and those with SideType.

version = 1

[[template]]
id = "pd-extrude"
types = ["PartDesign::Pad", "PartDesign::Pocket"]

# Midplane is deprecated where SideType exists (FreeCAD warns on setting
# it); Symmetric is one of the Sides.
[template.hide_if]
Midplane = "SideType"

# Rarely changed: with the result's other options, under Everything else.
[template.group_as]
AllowMultiFace = "Part Design"

# A "Profile plane" start is an "Offset" start at zero, and is never
# chosen here: an offset start shows its drag handle in the 3D view.
[[template.couple]]
value = "StartOffset"
mode = "StartType"
zero = "Profile plane"
nonzero = "Offset"

[template.choices]
Length = "Dimension"
TwoLengths = "Two lengths"
ThroughAll = "Through all"
UpToLast = "To last"
UpToFirst = "To first"
UpToFace = "Up to face"
UpToShape = "Up to shape"

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Sketch" },
]

[[template.card]]
title = "Extent"
heading = false
items = [
    { prop = "SideType", bare = true, editor = "segmented" },
]
after = [
    { prop = "UseCustomVector", label = "Direction", editor = "segmented", labels = ["Sketch normal", "Custom"], trail = "Reversed" },
    { prop = "Direction", show_if = { UseCustomVector = true } },
    { prop = "ReferenceAxis", label = "Reference axis", show_if = { UseCustomVector = true } },
    { prop = "AlongSketchNormal", label = "Along normal", editor = "switch", show_if = { UseCustomVector = true } },
]

# One column per side: how far, what that means (inside the field), and
# its taper. The second appears under the first for two sides.
[[template.card.column]]
title = "First side"
items = [
    { prop = "Length", lead = "Type", show_if = { Type = ["Length", "TwoLengths"] } },
    { prop = "UpToFace", label = "Up to", lead = "Type", show_if = { Type = "UpToFace" } },
    { prop = "UpToShape", label = "Up to", lead = "Type", show_if = { Type = "UpToShape" } },
    { prop = "Type", label = "Up to", editor = "dropdown", omit_if = { TwoLengths = "SideType" }, show_if = { Type = ["UpToLast", "UpToFirst", "ThroughAll"] } },
    { prop = "TaperAngle", label = "Taper", narrow = true, show_if = { Type = ["Length", "TwoLengths"] } },
    { prop = "Offset", narrow = true, show_if = { Type = ["UpToLast", "UpToFirst", "UpToFace", "UpToShape"] } },
]

[[template.card.column]]
title = "Second side"
show_if = { SideType = "Two sides", Type = "TwoLengths" }
items = [
    { prop = "Length2", label = "Length", lead = "Type2", show_if = { Type2 = "Length" } },
    { prop = "UpToFace2", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToFace" } },
    { prop = "UpToShape2", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToShape" } },
    { prop = "Type2", label = "Up to", editor = "dropdown", omit_if = { TwoLengths = "SideType" }, show_if = { Type2 = ["UpToLast", "UpToFirst", "ThroughAll"] } },
    { prop = "TaperAngle2", label = "Taper", narrow = true, show_if = { Type2 = "Length" } },
    { prop = "Offset2", label = "Offset", narrow = true, show_if = { Type2 = ["UpToLast", "UpToFirst", "UpToFace", "UpToShape"] } },
]

[[template.card]]
title = "Start"
heading = false
items = [
    [{ prop = "StartOffset", label = "Start offset" },
     { prop = "StartType", bare = true, editor = "segmented", labels = ["Profile", "Reference"] }],
    { prop = "StartReference", label = "Reference", show_if = { StartType = "Reference" } },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Fillet: how round, and which edges; then what the result keeps.
[[template]]
id = "pd-fillet"
types = ["PartDesign::Fillet"]

[[template.card]]
title = "Fillet"
items = [
    "Radius",
    { prop = "UseAllEdges", label = "Edges", editor = "segmented", labels = ["Selected", "All"], wide = true },
    { prop = "Base", label = "Selected edges", wide = true, show_if = { UseAllEdges = false } },
]
hint = "One edge of a tangent chain fillets the whole chain."

[[template.card]]
title = "Result"
items = [
    { prop = "Refine", editor = "switch" },
    { prop = "SupportTransform", label = "Pattern with its base feature", editor = "switch", wide = true },
]

# Revolution and Groove, laid out as Pad and Pocket: the profile, the
# axis it turns about (reversed beside it), how far each side turns, the
# start, and the result.
[[template]]
id = "pd-revolve"
types = ["PartDesign::Revolution", "PartDesign::Groove"]

[template.hide_if]
Midplane = "SideType"

[template.group_as]
AllowMultiFace = "Part Design"

[[template.couple]]
value = "StartOffset"
mode = "StartType"
zero = "Profile plane"
nonzero = "Offset"

[template.choices]
Angle = "Angle"
ThroughAll = "Through all"
UpToLast = "To last"
UpToFirst = "To first"
UpToFace = "Up to face"
UpToShape = "Up to shape"

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Sketch" },
    { prop = "ReferenceAxis", label = "Axis", trail = "Reversed" },
]

[[template.card]]
title = "Extent"
heading = false
items = [
    { prop = "SideType", bare = true, editor = "segmented" },
]

[[template.card.column]]
title = "First side"
items = [
    { prop = "Angle", lead = "Type", show_if = { Type = "Angle" } },
    { prop = "UpToFace", label = "Up to", lead = "Type", show_if = { Type = "UpToFace" } },
    { prop = "UpToShape", label = "Up to", lead = "Type", show_if = { Type = "UpToShape" } },
    { prop = "Type", label = "Up to", editor = "dropdown", omit_if = { "?TwoAngles" = "SideType" }, show_if = { Type = ["UpToLast", "UpToFirst", "ThroughAll"] } },
]

[[template.card.column]]
title = "Second side"
show_if = { SideType = "Two sides" }
items = [
    { prop = "Angle2", label = "Angle", lead = "Type2", show_if = { Type2 = "Angle" } },
    { prop = "UpToFace2", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToFace" } },
    { prop = "UpToShape2", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToShape" } },
    { prop = "Type2", label = "Up to", editor = "dropdown", omit_if = { "?TwoAngles" = "SideType" }, show_if = { Type2 = ["UpToLast", "UpToFirst", "ThroughAll"] } },
]

[[template.card]]
title = "Start"
heading = false
items = [
    [{ prop = "StartOffset", label = "Start offset" },
     { prop = "StartType", bare = true, editor = "segmented", labels = ["Profile", "Reference"] }],
    { prop = "StartReference", label = "Reference", show_if = { StartType = "Reference" } },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Additive and subtractive lofts: the profile, the sections it passes
# through in order, how the surface runs between them, and the result.
[[template]]
id = "pd-loft"
types = ["PartDesign::AdditiveLoft", "PartDesign::SubtractiveLoft"]
# Inherited from sketch-based features, but unused by a loft (the wiki
# lists them as not applicable).
hide = ["Midplane", "Reversed", "AllowMultiFace", "UpToFace", "UpToFace2",
        "UpToShape", "UpToShape2"]

[template.choices]
Subtraction = "Cut"
Common = "Keep common"

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Profile", whole = true },
    { prop = "Sections", label = "Sections", whole = true },
]

[[template.card]]
title = "Shape"
heading = false
items = [
    { prop = "Ruled", label = "Surface", editor = "segmented", labels = ["Smooth", "Ruled"] },
    { prop = "Closed", label = "Closed", editor = "switch" },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Operation", label = "Operation", editor = "segmented", show_if = { Operation = ["Subtraction", "Common"] } },
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Additive and subtractive pipes: the profile swept along a path, how it
# turns at corners and along the way, optional further sections, and the
# result. The pipe writes its settings to the feature as they change.
[[template]]
id = "pd-pipe"
types = ["PartDesign::AdditivePipe", "PartDesign::SubtractivePipe"]
# Inherited from sketch-based features, but unused by a pipe.
hide = ["Midplane", "Reversed", "UpToFace", "UpToFace2", "UpToShape",
        "UpToShape2"]

[template.group_as]
AllowMultiFace = "Part Design"

[template.choices]
Constant = "One profile"
Multisection = "Several"
Transformed = "Transformed"
"Right corner" = "Right corner"
"Round corner" = "Round corner"
Standard = "Standard"
Fixed = "Fixed"
Frenet = "Frenet"
Auxiliary = "Guide path"
Binormal = "Binormal"
Subtraction = "Cut"
Common = "Keep common"

[[template.card]]
title = "Path"
heading = false
items = [
    { prop = "Profile", label = "Profile", whole = true },
    { prop = "Spine", label = "Path" },
    { prop = "SpineTangent", label = "Tangent edges", editor = "switch" },
]

[[template.card]]
title = "Sections"
heading = false
items = [
    # Linear, S-shape and Interpolation do not work yet (the wiki says);
    # every pipe has Mode, so they are always left out.
    { prop = "Transformation", label = "Sections", editor = "segmented", omit_if = { Linear = "Mode", "S-shape" = "Mode", Interpolation = "Mode" } },
    { prop = "Sections", label = "Through", whole = true, show_if = { Transformation = "Multisection" } },
    { prop = "Transition", label = "Corners", editor = "dropdown" },
]

[[template.card]]
title = "Orientation"
heading = false
items = [
    { prop = "Mode", label = "Orientation", editor = "dropdown" },
    { prop = "AuxiliarySpine", label = "Guide path", show_if = { Mode = "Auxiliary" } },
    { prop = "AuxiliarySpineTangent", label = "Tangent edges", editor = "switch", show_if = { Mode = "Auxiliary" } },
    { prop = "AuxiliaryCurvilinear", label = "Curvilinear", editor = "switch", show_if = { Mode = "Auxiliary" } },
    { prop = "Binormal", show_if = { Mode = "Binormal" } },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Operation", label = "Operation", editor = "segmented", show_if = { Operation = ["Subtraction", "Common"] } },
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]
